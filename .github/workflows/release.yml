name: pypi-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-chglog needs the full history and tags to build the changelog.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install --upgrade pip 
          pip install hatch

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Generate Changelog
        run: |
          go install github.com/git-chglog/git-chglog/cmd/git-chglog@v0.15.4
          # `go install` drops the binary in $(go env GOPATH)/bin, which is not on
          # the runner's PATH, so invoke it by its absolute path.
          # Generate the changelog using git-chglog and store it in a temporary file
          "$(go env GOPATH)/bin/git-chglog" -c ./.chglog/config-action.yml -o /tmp/changelog.md


      - name: Check package version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(hatch version)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $tag_version, but" \
                 "airflow_providers_couchbase/__about__.py says $pkg_version." \
                 "Bump __about__.py and re-tag."
            exit 1
          fi
          echo "Version $pkg_version matches tag $GITHUB_REF_NAME."

      - name: Build package
        run: hatch build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  