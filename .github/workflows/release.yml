name: pypi-release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9].[0-9]+.[0-9]+*"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write # IMPORTANT: this permission is mandatory for trusted publishing
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # git-chglog needs the full history and tags to build the changelog.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          pip install --upgrade pip 
          pip install hatch

      - name: Generate Changelog
        run: |
          go install github.com/git-chglog/git-chglog/cmd/git-chglog@v0.15.4
          # Generate the changelog using git-chglog and store it in a temporary file
          git-chglog -c ./.chglog/config-action.yml -o /tmp/changelog.md


      - name: Build package
        run: hatch build

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/changelog.md
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  