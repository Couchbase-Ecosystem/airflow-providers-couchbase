[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airflow-providers-couchbase"
dynamic = ["version"]
authors = [
  { name = "Shyam Venkat", email = "shyam.venkat@couchbase.com" },
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Apache Airflow",
    "Framework :: Apache Airflow :: Provider",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]

description = "A package to simplify connecting to the couchbase nosql database from Apache Airflow"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "apache-airflow >= 3.3.1, < 4.0.0",
  "couchbase == 4.*",
]

[project.urls]
Documentation = "https://github.com/Couchbase-Ecosystem/airflow-providers-couchbase#readme"
Issues = "https://github.com/Couchbase-Ecosystem/airflow-providers-couchbase/issues"
Source = "https://github.com/Couchbase-Ecosystem/airflow-providers-couchbase"

[project.entry-points."apache_airflow_provider"]
provider_info = "airflow_providers_couchbase:get_provider_info"

[tool.hatch.version]
path = "airflow_providers_couchbase/__about__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["airflow_providers_couchbase"]

[tool.hatch.build.targets.sdist]
include = [
  "airflow_providers_couchbase",
  "tests",
  "README.md",
  "LICENSE",
]


## Development environments

[tool.hatch.envs.default]
extra-dependencies = [
    "pytest",
]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-cov = "coverage run -m pytest {args:tests}"
cov-report = ["- coverage combine", "coverage html"]
cov = ["test-cov", "cov-report"]

[tool.hatch.envs.lint]
detached = true
dependencies = [
  "black>=23.1.0",
  "mypy>=1.0.0",
  "ruff>=0.0.243",
]

[tool.hatch.envs.lint.scripts]
typing = "mypy --install-types --non-interactive --explicit-package-bases {args:airflow_providers_couchbase tests docker/dags}"
style = [
  "ruff check {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "ruff check {args:.} --fix",
  "style",
]
all = [
  "style",
  "typing",
]


## Linting, typing and test configuration

[tool.black]
target-version = ["py311"]
line-length = 130
skip-string-normalization = true

[tool.ruff]
target-version = "py311"
line-length = 130
lint.select = [
  "A",
  "ARG",
  "B",
  "C",
  "DTZ",
  "E",
  "EM",
  "F",
  "FBT",
  "I",
  "ICN",
  "ISC",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "Q",
  "RUF",
  "S",
  "T",
  "TID",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  # Allow non-abstract empty methods in abstract base classes
  "B027",
  # Allow boolean positional values in function calls, like `dict.get(... True)`
  "FBT003",
  # Ignore checks for possible passwords
  "S105", "S106", "S107",
  # Ignore complexity
  "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915",
]
lint.unfixable = [
  # Don't touch unused imports
  "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["airflow", "airflow_providers_couchbase"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports, and `mock.patch`
# injects mocks that a test does not always need to inspect.
"tests/**/*" = ["ARG002", "PLR2004", "S101", "TID252"]
# Example DAGs favour readability over lint purity
"docker/dags/*" = ["T201"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "unit_test: unit tests",
  "integration_test: integration tests",
]
